<!DOCTYPE html>
<html lang="en"><head><script>(function(){var f=window.fetch,m={};window.fetch=function(u,o){if(typeof u==='string'&&/^(\.\/)?(collection|wishlist)\.json/.test(u)){var k=u.split('?')[0];if(!m[k])m[k]=f(k,{cache:'no-cache'}).catch(function(e){delete m[k];throw e});return m[k].then(function(r){return r.clone()})}return f.apply(this,arguments)}})();</script><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Most Wanted — The Archive</title>
<style>
:root{--bg:#0d0d0d;--s:#171717;--s2:#202020;--t:#efefef;--m:#8a8a8a;--a:#e8b94f;--g:#4caf7d;--b:#5b9bd5;--br:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:14px/1.4 'DM Sans',-apple-system,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 40px;max-width:760px;margin:0 auto}
a{color:var(--b)}h1{font:400 26px 'DM Serif Display',Georgia,serif;color:var(--a);margin:8px 0 2px}.sub{color:var(--m);font-size:12px;margin-bottom:14px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--s);border:1px solid var(--br);color:var(--m);border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer}.chip.on{color:var(--a);border-color:var(--a)}
.row{display:flex;gap:10px;align-items:center;background:var(--s);border:1px solid var(--br);border-radius:10px;padding:9px 11px;margin-bottom:6px;cursor:pointer}
.n{font:700 18px 'DM Serif Display',serif;color:var(--a);min-width:26px;text-align:center}.i{flex:1;min-width:0}.i b{font-weight:600}.i small{color:var(--m);display:block;font-size:11px}
.tag{font-size:10px;border-radius:4px;padding:1px 5px;background:var(--s2);color:var(--m);margin-right:3px;white-space:nowrap}.w{color:var(--a);border:1px solid var(--a)}
#sh{position:fixed;inset:auto 0 0 0;background:var(--s);border-top:1px solid var(--br);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.22s;max-width:760px;margin:0 auto;z-index:9}#sh.o{transform:none}
#sh h2{font:400 21px 'DM Serif Display',serif}.lk{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.lk a,.lk button{background:var(--s2);border:1px solid var(--br);color:var(--t);border-radius:8px;padding:8px 12px;font:600 12px inherit;text-decoration:none;cursor:pointer}
.pr{background:var(--a)!important;color:#1a1a1a!important;border-color:var(--a)!important}.x{float:right;background:none;border:0;color:var(--m);font-size:22px;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:8}#ov.o{display:block}.msg{color:var(--m);padding:30px 0;text-align:center}
</style></head><body>
<a href="index.html">← The Archive</a>
<h1>Most Wanted</h1><div class="sub" id="sub">Loading…</div>
<div class="bar" id="bar"></div><div id="out"></div>
<div id="ov" onclick="cl()"></div>
<div id="sh"><button class="x" onclick="cl()">×</button><div id="card"></div></div>
<script>
var LISTS=[['Letterboxd 500','lb500.html'],['IMDb 250','imdb250.html'],['Empire 500','empire500.html'],['S&S Critics','sightsound.html#critics'],['S&S Directors','sightsound.html#directors'],['BBC 21st C.','bbc21.html'],['LaCinetek','lacinetek-top.html'],['TSPDT 1000','tspdt1000.html'],['Edgar Wright','edgar-wright-1000.html']];
var N=function(s){return(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')};
var E=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function parse(t){var re=/\{"?r"?:(\d+),"?t"?:("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'),"?y"?:(\d{4})/g,o=[],m,s;while((m=re.exec(t))){try{s=m[2][0]==="'"?m[2].slice(1,-1).replace(/\\'/g,"'"):JSON.parse(m[2]);o.push({r:+m[1],t:s,y:+m[3]})}catch(e){}}return o}
var G=[],WL=[],mode='all',minL=2;
function wlIds(){return WL}
Promise.all([fetch('collection.json?v='+Date.now()).then(r=>r.json()),fetch('wishlist.json?v='+Date.now()).then(r=>r.json())].concat(LISTS.map(l=>fetch(l[1].split('#')[0]).then(r=>r.ok?r.text():'').catch(()=>''))))
.then(function(R){
  var C=R[0];WL=Array.isArray(R[1])?R[1]:(R[1].films||[]);
  var ss=R[5],cut=ss.indexOf('directors:{films:'),T=[R[2],R[3],R[4],cut>0?ss.slice(0,cut):ss,cut>0?ss.slice(cut):'',R[7],R[8],R[9],R[10]];
  var own={},wish={};
  C.forEach(function(c){[c.title].concat(c.alt_titles||[]).forEach(function(t){(own[N(t)]=own[N(t)]||[]).push(c.year)})});
  WL.forEach(function(w){[w.title].concat(w.alt_titles||[]).forEach(function(t){(wish[N(t)]=wish[N(t)]||[]).push(w)})});
  var near=function(a,y){return a&&a.some(function(x){return Math.abs((+x||0)-y)<=2})};
  var pop={};
  T.forEach(function(txt,i){parse(txt).forEach(function(f){
    var k=N(f.t);if(near(own[k],f.y))return;
    var arr=pop[k]=pop[k]||[],g=arr.find(function(x){return Math.abs(x.y-f.y)<=2});
    if(!g){g={t:f.t,y:f.y,l:{}};arr.push(g)}g.l[i]=Math.min(g.l[i]||1e9,f.r)})});
  Object.keys(pop).forEach(function(k){pop[k].forEach(function(g){
    var w=(wish[k]||[]).find(function(x){return Math.abs((+x.year||0)-g.y)<=2});
    g.w=w||null;g.n=Object.keys(g.l).length;
    g.pts=Object.keys(g.l).reduce(function(s,i){return s+(1000-g.l[i])/10},0);G.push(g)})});
  G.sort(function(a,b){return b.n-a.n||b.pts-a.pts});draw();
}).catch(function(e){document.getElementById('sub').textContent='Could not load data ('+e+'). Open via your site, not a file.'});
function draw(){
  var bar='';[['all','All'],['wish','On wishlist'],['no','Not on wishlist']].forEach(function(m){bar+='<span class="chip '+(mode===m[0]?'on':'')+'" onclick="mode=\''+m[0]+'\';draw()">'+m[1]+'</span>'});
  [2,3,4,5,6].forEach(function(n){bar+='<span class="chip '+(minL===n?'on':'')+'" onclick="minL='+n+';draw()">'+n+'+ lists</span>'});
  document.getElementById('bar').innerHTML=bar;
  var L=G.filter(function(g){return g.n>=minL&&(mode==='all'||(mode==='wish')===!!g.w)});
  document.getElementById('sub').textContent=L.length+' films you don’t own, ranked by how many of your '+LISTS.length+' lists include them';
  document.getElementById('out').innerHTML=L.slice(0,150).map(function(g){var i=G.indexOf(g);
    return'<div class="row" onclick="op('+i+')"><div class="n">'+g.n+'</div><div class="i"><b>'+E(g.t)+'</b> <span style="color:var(--m)">'+g.y+'</span>'+(g.w?' <span class="tag w">'+E(g.w.priority||'Wishlist')+'</span>':'')+'<small>'+Object.keys(g.l).map(function(k){return LISTS[k][0]+' #'+g.l[k]}).join(' · ')+'</small></div></div>'}).join('')||'<div class="msg">Nothing here.</div>';
}
function op(i){var g=G[i],q=encodeURIComponent(g.t+' '+g.y),w=g.w;
  document.getElementById('card').innerHTML='<h2>'+E(g.t)+'</h2><div class="sub">'+g.y+(w&&w.director?' · '+E(w.director):'')+' · on '+g.n+' lists</div>'
  +'<div>'+Object.keys(g.l).map(function(k){return'<a class="tag" href="'+LISTS[k][1]+'">'+LISTS[k][0]+' #'+g.l[k]+'</a>'}).join('')+'</div>'
  +'<div class="lk">'+(w?'<a class="pr" href="wishlist.html#film='+encodeURIComponent(w.id)+'">Open wishlist card</a>':'<a class="pr" href="add.html?list=wish&y='+g.y+'&q='+encodeURIComponent(g.t)+'">Add to wishlist</a>')
  +'<a target="_blank" rel="noopener" href="'+(w&&w.lb?E(w.lb):'https://letterboxd.com/search/films/'+q+'/')+'">Letterboxd</a>'
  +'<a target="_blank" rel="noopener" href="'+(w&&w.imdb_id?'https://www.imdb.com/title/'+w.imdb_id+'/':'https://www.imdb.com/find/?q='+q)+'">IMDb</a>'
  +'<a target="_blank" rel="noopener" href="'+(w&&w.tmdb_id?'https://www.themoviedb.org/movie/'+w.tmdb_id:'https://www.themoviedb.org/search?query='+q)+'">TMDB</a></div>';
  document.getElementById('sh').classList.add('o');document.getElementById('ov').classList.add('o')}
function cl(){document.getElementById('sh').classList.remove('o');document.getElementById('ov').classList.remove('o')}
function cp(t,b){var d=document.createElement('textarea');d.value=t.replace(/&quot;/g,'"');document.body.appendChild(d);d.select();try{document.execCommand('copy');b.textContent='Copied — paste in Terminal'}catch(e){}d.remove()}
document.addEventListener('keydown',function(e){if(e.key==='Escape')cl()});
</script></body></html>

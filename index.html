<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>My Movie Collection</title>
<style>
:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:rgba(255,255,255,0.08);--text:#f0f0f0;--muted:#888;--accent:#e8b94f;--green:#4caf7d;--blue:#5b9bd5;--r:6px;--gap:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px 0;position:sticky;top:0;z-index:100}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.count{font-size:12px;color:var(--muted)}
.sw{position:relative;margin-bottom:10px}
.sw input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 36px 9px 36px;font-size:15px;outline:none;-webkit-appearance:none}
.sw input:focus{border-color:rgba(255,255,255,.25)}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.sc{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;display:none;line-height:1;padding:0 4px}
.fb{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fb::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;user-select:none}
.chip.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
.stats{display:flex;border-top:1px solid var(--border)}
.stat{flex:1;text-align:center;padding:6px 4px}
.stat .n{font-size:16px;font-weight:700}
.stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.gw{padding:var(--gap)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
@media(min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(7,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(9,1fr)}}
.card{position:relative;cursor:pointer;border-radius:var(--r);overflow:hidden;background:var(--surface2);aspect-ratio:2/3;transition:transform .15s}
.card:active{transform:scale(.96)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.fb2{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center}
.fb2 .ft{font-size:11px;font-weight:600;line-height:1.3;color:var(--text);margin-bottom:4px}
.fb2 .fy{font-size:10px;color:var(--muted)}
.wb{position:absolute;top:4px;right:4px;background:rgba(76,175,125,.9);border-radius:50%;width:18px;height:18px;display:none;align-items:center;justify-content:center;font-size:10px}
.card.W .wb{display:flex}
.sb{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:16px 6px 5px;font-size:11px;font-weight:700;color:var(--accent);text-align:right}
.kb{position:absolute;top:4px;left:4px;background:rgba(91,155,213,.9);border-radius:3px;font-size:8px;font-weight:800;padding:1px 4px;color:#fff;display:none}
.card.K .kb{display:block}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{font-size:18px;margin-bottom:8px;color:var(--text)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:all}
.sh{position:fixed;bottom:0;left:0;right:0;max-height:85vh;background:var(--surface);border-radius:16px 16px 0 0;z-index:201;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh.open{transform:translateY(0)}
.shn{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.shi{padding:16px 20px 40px}
.shh{display:flex;gap:16px;margin-bottom:16px}
.shp{width:90px;flex-shrink:0;border-radius:6px;overflow:hidden;background:var(--surface2);aspect-ratio:2/3}
.shp img{width:100%;height:100%;object-fit:cover}
.shm{flex:1;min-width:0}
.sht{font-size:18px;font-weight:700;line-height:1.2;margin-bottom:4px}
.shd{font-size:13px;color:var(--muted);margin-bottom:8px}
.shs{font-size:26px;font-weight:800;color:var(--accent);line-height:1}
.shs span{font-size:13px;font-weight:400;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:11px;color:var(--muted)}
.tag.b{border-color:rgba(91,155,213,.4);color:var(--blue)}
.tag.g{border-color:rgba(76,175,125,.4);color:var(--green)}
.tag.a{border-color:rgba(232,185,79,.4);color:var(--accent)}
.div{border:none;border-top:1px solid var(--border);margin:14px 0}
.dr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.dr .lb{color:var(--muted)}.dr .vl{font-weight:500;text-align:right;max-width:60%}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>My Collection</h1><span class="count" id="cnt"></span></div>
  <div class="sw">
    <span class="si">⌕</span>

  <div class="fb" id="fb">
    <div class="chip active" data-f="all">All</div>

    <div class="chip" data-f="criterion">Criterion</div>
    <div class="chip" data-f="arrow">Arrow</div>
    <div class="chip" data-f="top">Score 9+</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="n" id="sT">—</div><div class="l">Films</div></div>
    <div class="stat"><div class="n" id="sW">—</div><div class="l">Watched</div></div>
    <div class="stat"><div class="n" id="sK">—</div><div class="l">4K</div></div>
    <div class="stat"><div class="n" id="sA">—</div><div class="l">Avg</div></div>
  </div>
</header>
<div class="gw">
  <div class="grid" id="grid"></div>
  <div class="empty" id="emp" style="display:none"><h2>No films found</h2><p>Try a different search</p></div>
</div>
<div class="ov" id="ov"></div>
<div class="sh" id="sh"><div class="shn"></div><div class="shi" id="shi"></div></div>

let fil=[],af='all',sq='';

function filt(){
  const q=sq.toLowerCase();
  fil=C.filter(f=>{
    if(q&&!(f.title+' '+f.director).toLowerCase().includes(q))return false;
    switch(af){
      case 'unwatched':return!f.watched;
      case 'watched':return f.watched;
      case '4k':return f.format==='4K Blu-ray';
      case 'criterion':return f.distributor==='Criterion Collection';
      case 'arrow':return f.distributor==='Arrow Films';
      case 'top':return f.score>=9.0;
      default:return true;
    }
  });
  fil.sort((a,b)=>(b.score||0)-(a.score||0)||a.title.localeCompare(b.title));
  render();
  document.getElementById('cnt').textContent=fil.length===C.length?C.length+' films':fil.length+' of '+C.length;
}

function render(){
  const g=document.getElementById('grid'),e=document.getElementById('emp');
  if(!fil.length){g.innerHTML='';e.style.display='block';return;}
  e.style.display='none';
  g.innerHTML=fil.map((f,i)=>{
    const W=f.watched?'W':'',K=f.format==='4K Blu-ray'?'K':'';
    const sc=f.score?f.score.toFixed(1):'';
    const img=f.poster?`<img src="${f.poster}" alt="${x(f.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''
    const fb=`<div class="fb2" ${f.poster?'style="display:none"':''}><div class="ft">${x(f.title)}</div><div class="fy">${f.year||''}</div></div>`;
    return`<div class="card ${W} ${K}" onclick="open2(${i})">${img}${fb}<div class="wb">✓</div>${K?'<div class="kb">4K</div>':''}${sc?`<div class="sb">${sc}</div>`:''}</div>`;
  }).join('');
}

function stats(){
  const w=C.filter(f=>f.watched).length,k=C.filter(f=>f.format==='4K Blu-ray').length;
  const sc=C.map(f=>f.score).filter(Boolean);
  const avg=sc.length?(sc.reduce((a,b)=>a+b,0)/sc.length).toFixed(1):'—';
  document.getElementById('sT').textContent=C.length;
  document.getElementById('sW').textContent=w;
  document.getElementById('sK').textContent=k;
  document.getElementById('sA').textContent=avg;
}

function open2(i){
  const f=fil[i];if(!f)return;
  const p=f.poster?`<img src="${f.poster}" alt="${x(f.title)}">`:`<div class="fb2"><div class="ft">${x(f.title)}</div></div>`;
  const gs=f.genre?f.genre.split(',').slice(0,3).map(g=>`<span class="tag">${g.trim()}</span>`).join(''):'';
  const wt=f.watched?'<span class="tag g">✓ Watched</span>':'<span class="tag">Unwatched</span>';
  const ft=f.format==='4K Blu-ray'?'<span class="tag b">4K Blu-ray</span>':(f.format?`<span class="tag">${f.format}</span>`:'');
  const sp=f.distributor==='Criterion Collection'&&f.spine?`<span class="tag">C${f.spine}</span>`:'';
  document.getElementById('shi').innerHTML=`
    <div class="shh">
      <div class="shp">${p}</div>
      <div class="shm">
        <div class="sht">${x(f.title)}</div>
        <div class="shd">${x(f.director)}${f.year?' · '+f.year:''}</div>
        ${f.score?`<div class="shs">${f.score.toFixed(1)}<span> / 10</span></div>`:''}
        <div class="tags">${wt}${ft}${sp}</div>
      </div>
    </div>
    <hr class="div">
    ${gs?`<div class="tags" style="margin-bottom:12px">${gs}</div>`:''}
    ${r('Distributor',f.distributor)}${r('Country',f.country)}${r('Runtime',f.runtime?f.runtime+' min':'')}
  `;
  document.getElementById('sh').classList.add('open');
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow='hidden';
}

function cls(){
  document.getElementById('sh').classList.remove('open');
  document.getElementById('ov').classList.remove('open');
  document.body.style.overflow='';
}

function r(l,v){return v?`<div class="dr"><span class="lb">${l}</span><span class="vl">${x(v)}</span></div>`:''}
function x(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

document.getElementById('q').addEventListener('input',e=>{
  sq=e.target.value;
  document.getElementById('qc').style.display=sq?'block':'none';
  filt();
});
document.getElementById('qc').addEventListener('click',()=>{
  document.getElementById('q').value='';sq='';
  document.getElementById('qc').style.display='none';filt();
});
document.getElementById('fb').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');af=c.dataset.f;filt();
});
document.getElementById('ov').addEventListener('click',cls);
let sy=0;
document.getElementById('sh').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
document.getElementById('sh').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-sy>80)cls()},{passive:true});

stats();filt();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cahiers">

<title>Cahiers — Collection Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --owned: #c8f0a0;
    --owned-dim: rgba(200,240,160,0.12);
    --owned-mid: rgba(200,240,160,0.35);
    --wishlist: #f0d080;
    --wishlist-dim: rgba(240,208,128,0.12);
    --wishlist-mid: rgba(240,208,128,0.35);
    --missing: #e05555;
    --missing-dim: rgba(224,85,85,0.1);
    --missing-mid: rgba(224,85,85,0.3);
    --text: #e8e4dc;
    --text-dim: #888;
    --text-faint: #444;
    --accent: #c8f0a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* HEADER */
  .header {
    padding: calc(3rem + env(safe-area-inset-top, 0px)) 2rem 2rem;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: rgba(14,14,14,0.96);
    backdrop-filter: blur(12px);
  }
  .header-top {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    line-height: 1; letter-spacing: -0.02em;
    color: var(--text);
  }
  h1 em { color: var(--accent); font-style: italic; }
  .last-updated { font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }

  /* STATS BAR */
  .stats {
    display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1.5rem;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem; line-height: 1;
  }
  .stat-num.owned { color: var(--owned); }
  .stat-num.wishlist { color: var(--wishlist); }
  .stat-num.missing { color: var(--missing); }
  .stat-label { font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }

  /* PROGRESS BAR */
  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-bar {
    height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    display: flex;
  }
  .progress-seg { height: 100%; transition: width 0.5s ease; }
  .progress-seg.owned { background: var(--owned); }
  .progress-seg.wishlist { background: var(--wishlist); }
  .progress-seg.missing { background: var(--border); }

  /* CONTROLS */
  .controls {
    display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
  }
  .filter-btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 5px 14px; border-radius: 2px;
    border: 1px solid var(--border);
    background: transparent; color: var(--text-dim);
    cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .filter-btn.active-all { border-color: var(--text); color: var(--text); background: var(--surface2); }
  .filter-btn.active-owned { border-color: var(--owned); color: var(--owned); background: var(--owned-dim); }
  .filter-btn.active-wishlist { border-color: var(--wishlist); color: var(--wishlist); background: var(--wishlist-dim); }
  .filter-btn.active-missing { border-color: var(--missing); color: var(--missing); background: var(--missing-dim); }

  .search-wrap { margin-left: auto; position: relative; }
  .search-input {
    font-family: 'DM Mono', monospace; font-size: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 12px 5px 30px;
    border-radius: 2px; width: 200px; outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--text-dim); }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 12px; pointer-events: none; }

  /* SORT */
  .sort-wrap { display: flex; gap: 4px; margin-left: 8px; }
  .sort-btn {
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 2px;
    border: 1px solid var(--border);
    background: transparent; color: var(--text-faint);
    cursor: pointer; transition: all 0.15s;
  }
  .sort-btn.active { border-color: var(--text-dim); color: var(--text-dim); }

  /* LIST */
  .film-list {
    padding: 0 2rem 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
    gap: 1px;
  }

  .film-item {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.6rem 1rem 0.6rem 0;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
    cursor: default;
  }
  .film-item:hover { background: var(--surface); }
  .film-item.status-owned { border-left: 2px solid var(--owned); padding-left: calc(1rem - 2px); }
  .film-item.status-wishlist { border-left: 2px solid var(--wishlist); padding-left: calc(1rem - 2px); }
  .film-item.status-missing { border-left: 2px solid var(--text-faint); padding-left: calc(1rem - 2px); }

  .rank {
    font-size: 11px; color: var(--text-faint);
    width: 32px; text-align: right; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .film-info { flex: 1; min-width: 0; }
  .film-title {
    font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.3;
  }
  .film-title.faded { color: var(--text-dim); }
  .film-year { font-size: 10px; color: var(--text-faint); margin-top: 1px; }
  .status-pill {
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 1px; flex-shrink: 0;
    font-weight: 500;
  }
  .pill-owned { background: var(--owned-dim); color: var(--owned); border: 1px solid var(--owned-mid); }
  .pill-wishlist { background: var(--wishlist-dim); color: var(--wishlist); border: 1px solid var(--wishlist-mid); }
  .pill-missing { background: transparent; color: var(--text-faint); border: 1px solid var(--border); }

  /* EMPTY STATE */
  .empty { padding: 4rem 2rem; text-align: center; color: var(--text-dim); font-size: 13px; }

  /* COUNT DISPLAY */
  .count-display {
    font-size: 11px; color: var(--text-dim); padding: 1rem 2rem 0.5rem;
    letter-spacing: 0.05em;
  }

  @media (max-width: 600px) {
    .header { padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1rem 1rem; }
    .film-list { padding: 0 0 4rem; }
    .count-display { padding: 1rem 1rem 0.5rem; }
    .stats { gap: 1.2rem; }
    .stat-num { font-size: 1.6rem; }
  }
.top-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.back{font-size:11px;color:var(--text-dim);text-decoration:none;letter-spacing:.08em;text-transform:uppercase;display:inline-block;padding:10px 0}
.back:hover{color:var(--text)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

<div class="header">
  <div class="top-row"><a class="back" href="index.html">← The Archive</a></div>

  </div>

  <div class="stats">

      <span class="stat-label">Owned</span>
    </div>
    <div class="stat">

      <span class="stat-label">Wishlist</span>
    </div>
    <div class="stat">
      <span class="stat-num missing" id="count-missing">0</span>

    <div class="stat">
      <span class="stat-num" id="count-pct" style="color:var(--text)">0%</span>

  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-seg owned" id="prog-owned" style="width:0%"></div>
      <div class="progress-seg wishlist" id="prog-wishlist" style="width:0%"></div>
    </div>
  </div>

  <div class="controls">
    <button class="filter-btn active-all" data-filter="all" onclick="setFilter('all')">All 100</button>
    <button class="filter-btn" data-filter="owned" onclick="setFilter('owned')">Owned</button>
    <button class="filter-btn" data-filter="wishlist" onclick="setFilter('wishlist')">Wishlist</button>
    <button class="filter-btn" data-filter="missing" onclick="setFilter('missing')">Missing</button>

    <div class="sort-wrap">
      <button class="sort-btn active" id="sort-rank" onclick="setSort('rank')">Rank</button>
      <button class="sort-btn" id="sort-year" onclick="setSort('year')">Year</button>
      <button class="sort-btn" id="sort-title" onclick="setSort('title')">Title</button>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-input" type="text" placeholder="Search..." id="search-input" oninput="onSearch()" />
    </div>
  </div>
</div>

let currentFilter = 'all';
let currentSort = 'rank';
let searchQ = '';

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn';
    if(b.dataset.filter === f) b.classList.add('active-'+f);
  });
  render();
}

function setSort(s) {
  currentSort = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort-'+s).classList.add('active');
  render();
}

function onSearch() {
  searchQ = document.getElementById('search-input').value.toLowerCase();
  render();
}

function render() {
  let films = [...FILMS];
  if(currentFilter !== 'all') films = films.filter(f => f.s === currentFilter);
  if(searchQ) films = films.filter(f => f.t.toLowerCase().includes(searchQ) || String(f.y).includes(searchQ));
  if(currentSort === 'year') films.sort((a,b) => a.y - b.y);
  else if(currentSort === 'title') films.sort((a,b) => a.t.localeCompare(b.t));
  else films.sort((a,b) => a.r - b.r);

  const listEl = document.getElementById('film-list');
  document.getElementById('count-display').textContent =
    `Showing ${films.length} film${films.length!==1?'s':''}`;

  listEl.innerHTML = films.map(f => `
    <a class="film-item status-${f.s}" href="${f.lb||('https://letterboxd.com/film/'+f.t.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-')+'/')}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">
      <span class="rank">${f.r}</span>
      <div class="film-info">
        <div class="film-title${f.s==='missing'?' faded':''}">${f.t}</div>
        <div class="film-year">${f.y}</div>
      </div>
      <span class="status-pill pill-${f.s}">${f.s==='owned'?'owned':f.s==='wishlist'?'wish':'—'}</span>
    </a>
  `).join('');
}

render();

// ===== Auto-sync statuses & links from collection.json / wishlist.json =====
function lbNorm(s){return (s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
const LB_ALIAS={dreams:'akirakurosawasdreams',jointsecurityarea:'jsajointsecurityarea'};
function lbCounts(){
  const nOwned=FILMS.filter(f=>f.s==='owned').length,nWish=FILMS.filter(f=>f.s==='wishlist').length,nMiss=FILMS.filter(f=>f.s==='missing').length;
  document.getElementById('count-owned').textContent=nOwned;
  document.getElementById('count-wishlist').textContent=nWish;
  document.getElementById('count-missing').textContent=nMiss;
  document.getElementById('count-pct').textContent=Math.round(nOwned*100/FILMS.length)+'%';
  document.getElementById('prog-owned').style.width=(nOwned*100/FILMS.length)+'%';
  document.getElementById('prog-wishlist').style.width=(nWish*100/FILMS.length)+'%';
}
async function lbSync(){
  try{
    const [c,w]=await Promise.all(['collection.json','wishlist.json'].map(u=>fetch(u+'?v='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json();})));
    const idx=a=>(Array.isArray(a)?a:(a.films||[])).map(d=>({n:lbNorm(d.title),y:d.year,lb:d.lb}));
    const ci=idx(c),wi=idx(w);
    const find=(list,f)=>{const k=LB_ALIAS[lbNorm(f.t)]||lbNorm(f.t);return list.find(d=>(d.n===k||(k.length>=10&&d.n.startsWith(k)))&&Math.abs(d.y-f.y)<=2);};
    FILMS.forEach(f=>{const o=find(ci,f),wl=o?null:find(wi,f);f.s=o?'owned':wl?'wishlist':'missing';f.lb=(o||wl||{}).lb||f.lb;});
    lbCounts();render();
  }catch(e){console.warn('cahiers sync skipped (using built-in statuses)',e);}
}
lbSync();
document.addEventListener("visibilitychange",()=>{document.hidden||lbSync()});
window.addEventListener("pageshow",e=>{e.persisted&&lbSync()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
lbCounts();
</script>

function getWl(){return wlP||(wlP=fetch('wishlist.json?v='+Date.now()).then(function(r){return r.json()}).then(function(d){return Array.isArray(d)?d:(d&&d.films)||[]}).catch(function(){return []}))}
var nz=function(s){return (s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function films(){return typeof curFilms==='function'?curFilms():FILMS}
function build(wl){
  var F=films(),wm=new Map();wl.forEach(function(w){if(w.title)wm.set(nz(w.title),w)});
  var onW=F.filter(function(f){return f.s==='wishlist'}).sort(function(a,b){return a.r-b.r});
  var top=Math.min(100,Math.ceil(F.length/5));
  var gaps=F.filter(function(f){return f.s==='missing'&&f.r<=top}).sort(function(a,b){return a.r-b.r});
  if(!onW.length&&!gaps.length)return '';
  function cardOf(f,red){
    var w=wm.get(nz(f.t)),p=w&&w.poster,sc=w&&+w.lb_score?(+w.lb_score).toFixed(1):'';
    var url=(w&&w.lb)||('https://letterboxd.com/search/'+encodeURIComponent(f.t)+'/');
    var img=p?'<img src="'+esc(p)+'" style="width:100%;height:100%;object-fit:cover" loading="lazy" alt="">':'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-dim);padding:3px;text-align:center">'+esc(f.t)+'</div>';
    var bg=red?'rgba(224,85,85,.85);color:#fff':'rgba(240,208,128,.85);color:#111';
    return '<a href="'+esc(url)+'" target="_blank" rel="noopener" style="flex:0 0 72px;text-decoration:none"><div style="position:relative;width:72px;height:108px;border-radius:6px;overflow:hidden;background:var(--surface2);margin-bottom:5px;border:1px solid var(--border)">'+img+'<div style="position:absolute;top:3px;right:3px;background:'+bg+';border-radius:3px;font-size:7px;font-weight:800;padding:1px 4px">#'+f.r+'</div></div><div style="font-size:9px;color:var(--text);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(f.t)+'</div>'+(sc?'<div style="font-size:9px;color:var(--wishlist)">★ '+sc+'</div>':'<div style="font-size:9px;color:var(--text-dim)">'+f.y+'</div>')+'</a>'}
  var row=function(a,r){return '<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none">'+a.map(function(f){return cardOf(f,r)}).join('')+'</div>'};
  var h='';
  if(onW.length)h+='<div style="margin-bottom:28px"><div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--wishlist);margin-bottom:4px">On Your Wishlist · '+onW.length+' film'+(onW.length!==1?'s':'')+'</div><div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Films from this list you already want — sorted by rank</div>'+row(onW,false)+'</div>';
  if(gaps.length)h+='<div><div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--missing);margin-bottom:4px">Top '+top+' Gaps · '+gaps.length+' film'+(gaps.length!==1?'s':'')+'</div><div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Highly ranked films not owned or wishlisted</div>'+row(gaps,true)+'</div>';
  return h;
}
function gaps(){
  try{
    var F=films(),k=F.length+':'+F.filter(function(f){return f.s==='wishlist'}).length+':'+F.filter(function(f){return f.s==='missing'}).length+':'+F[0].t;
    if(k===lastKey)return;lastKey=k;
    getWl().then(function(wl){
      var p=document.getElementById('gaps-panel');
      if(!p){var l=document.getElementById('film-list');if(!l)return;p=document.createElement('div');p.id='gaps-panel';p.style.padding='1.5rem 1rem 6rem';l.insertAdjacentElement('afterend',p)}
      p.innerHTML=build(wl);
    });
  }catch(e){console.warn('gaps',e)}
}
var _r=render;
render=function(){var r=_r.apply(this,arguments);gaps();return r};
gaps();
})();
</script>
</body>
</html>
